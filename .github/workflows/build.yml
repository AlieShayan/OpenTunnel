name: Build APK

# Push this repo to GitHub and the APK builds here — no local NDK or autotools
# needed. Grab it from the run's "Artifacts" section.
on:
  push:
    branches: ['**']
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      abis:
        description: "ABIs to build (comma separated)"
        default: "arm64-v8a,armeabi-v7a"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config

      - name: Cache openconnect downloads and sysroots
        uses: actions/cache@v4
        with:
          path: |
            native/build/downloads
            native/build/src
            native/build/arm64-v8a/sysroot
            native/build/armeabi-v7a/sysroot
            native/build/x86_64/sysroot
          key: native-${{ hashFiles('native/build-openconnect.sh', 'gradle.properties') }}

      - name: Build libopenconnect.so
        run: |
          ABIS="${{ github.event.inputs.abis || 'arm64-v8a,armeabi-v7a' }}"
          echo "OC_ABIS=$ABIS" >> "$GITHUB_ENV"
          bash native/build-openconnect.sh --abis "$ABIS"

      # -----------------------------------------------------------------------
      # Decode & verify the release keystore.
      # If KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS secrets are not set
      # the step exits with a clear error so we never silently produce a
      # debug-signed release APK (which would break "update" installs for users
      # who have a properly-signed version installed).
      # -----------------------------------------------------------------------
      - name: Decode Signing Keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          SIGNING_READY=false

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error ::Release signing secrets are incomplete."
            echo "::error ::Required GitHub Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS"
            echo "::error ::Without these the release APK cannot be signed consistently and"
            echo "::error ::users will hit 'App not installed as package conflicts with an existing package'"
            echo "::error ::when they try to update. Please add the secrets and re-run."
            echo "SIGNING_READY=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > release.keystore 2>/dev/null || true

          if [ ! -s release.keystore ]; then
            echo "::error ::KEYSTORE_BASE64 decoded to an empty file. Check the secret value."
            exit 1
          fi

          KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          KEYTOOL_BIN="$JAVA_HOME/bin/keytool"
          [ ! -x "$KEYTOOL_BIN" ] && KEYTOOL_BIN="keytool"

          if ! "$KEYTOOL_BIN" -list \
               -keystore release.keystore \
               -storepass "$KEYSTORE_PASSWORD" \
               -alias "$KEY_ALIAS" \
               -keypass "$KEY_PASS" >/dev/null 2>&1; then
            echo "::error ::Keystore verification failed — wrong password or alias."
            echo "::error ::Make sure KEYSTORE_PASSWORD and KEY_ALIAS match the actual keystore."
            exit 1
          fi

          echo "Release keystore verified ✅  (alias: $KEY_ALIAS)"
          echo "SIGNING_READY=true" >> "$GITHUB_OUTPUT"

      - name: Assemble APKs (Debug & Release)
        run: ./gradlew assemble -Popenconnect.abis="$OC_ABIS" --stacktrace
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: opentunnel_apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: libopenconnect-so
          path: app/src/main/jniLibs/**/libopenconnect.so
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
