name: Build APK

# Push this repo to GitHub and the APK builds here — no local NDK or autotools
# needed. Grab it from the run's "Artifacts" section.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      abis:
        description: "ABIs to build (comma separated)"
        default: "arm64-v8a,armeabi-v7a"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config

      - name: Cache openconnect downloads and sysroots
        uses: actions/cache@v4
        with:
          path: |
            native/build/downloads
            native/build/src
            native/build/arm64-v8a/sysroot
            native/build/armeabi-v7a/sysroot
            native/build/x86_64/sysroot
          key: native-${{ hashFiles('native/build-openconnect.sh', 'gradle.properties') }}

      - name: Build libopenconnect.so
        run: |
          ABIS="${{ github.event.inputs.abis || 'arm64-v8a,armeabi-v7a' }}"
          echo "OC_ABIS=$ABIS" >> "$GITHUB_ENV"
          bash native/build-openconnect.sh --abis "$ABIS"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug -Popenconnect.abis="$OC_ABIS" --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: opentunnel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: libopenconnect-so
          path: app/src/main/jniLibs/**/libopenconnect.so
          if-no-files-found: warn
