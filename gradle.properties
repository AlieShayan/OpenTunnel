org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true

kotlin.code.style=official

# ---------------------------------------------------------------------------
# Native (openconnect) build settings — consumed by native/build-openconnect.sh
# ---------------------------------------------------------------------------
# Version of openconnect fetched and cross-compiled for Android.
openconnect.version=9.21
# ABIs to build. Trim this list to speed up local builds, e.g. just arm64-v8a.
openconnect.abis=arm64-v8a,armeabi-v7a,x86_64
# Minimum Android API used for the native toolchain (must match minSdk).
openconnect.minApi=26
